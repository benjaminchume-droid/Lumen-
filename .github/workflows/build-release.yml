name: Build & Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.8.1)"
        required: true
        default: "1.8.1"
      version_code:
        description: "Version code (integer)"
        required: true
        default: "181"

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bootstrap Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare stable signing keystore
        id: keystore
        run: |
          set -euo pipefail
          mkdir -p android/app
          KS=android/app/release.keystore

          ALIAS="lumen"
          STORE_PASS="lumenStorePass2026"
          KEY_PASS="lumenStorePass2026"

          if [ ! -f android/signing/release.keystore.b64 ]; then
            echo "::error::Missing android/signing/release.keystore.b64 — required for continuous updates"
            exit 1
          fi

          tr -d '\n\r \t' < android/signing/release.keystore.b64 | base64 -d > "$KS"
          echo "Keystore size: $(wc -c < "$KS" | tr -d ' ')B"

          keytool -list -storetype PKCS12 -keystore "$KS" \
            -storepass "$STORE_PASS" -alias "$ALIAS"

          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
            echo "code=${{ github.event.inputs.version_code }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="${TAG#v}"
            CODE=$(echo "$NAME" | awk -F. '{print ($1*10000)+($2*100)+$3}')
            echo "name=$NAME" >> $GITHUB_OUTPUT
            echo "code=$CODE" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            # push to main — use VERSION file or default 1.8.1
            if [ -f android/VERSION ]; then
              NAME=$(tr -d ' \n\r' < android/VERSION)
            else
              NAME="1.8.1"
            fi
            CODE=$(echo "$NAME" | awk -F. '{print ($1*10000)+($2*100)+$3}')
            # unique tag per run so release does not collide
            TAG="v${NAME}+${GITHUB_RUN_NUMBER}"
            echo "name=$NAME" >> $GITHUB_OUTPUT
            echo "code=$CODE" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        working-directory: android
        env:
          LUMEN_KEYSTORE_PATH: app/release.keystore
          LUMEN_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          LUMEN_KEY_PASSWORD: ${{ steps.keystore.outputs.key_pass }}
          LUMEN_STORE_PASSWORD: ${{ steps.keystore.outputs.store_pass }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.version.name="$VERSION_NAME" \
            -Pandroid.injected.version.code="$VERSION_CODE"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Lumen ${{ steps.ver.outputs.name }}
          body: |
            ## Lumen ${{ steps.ver.outputs.name }}

            Signed release APK.

            - Dual runtime: Mihon PathClassLoader + LNReader Rhino
            - Hybrid chapter lists (extension + AJAX scrape merge)
            - Progressive Home with parallel sources
            - SourceRegistry contract for catalog/detail/content
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.keystore
